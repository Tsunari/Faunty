<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021a15" />
      <stop offset="100%" stop-color="#010a08" />
    </linearGradient>

    <!-- Vibrant Neon Text Gradient for Dark Backgrounds -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffb3" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- High Contrast Text Gradient for Light Backgrounds (Logo.png) -->
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#026e54" />
      <stop offset="100%" stop-color="#015273" />
    </linearGradient>
  </defs>

  <!-- Base Squircle Card -->
  <rect id="bgCard" x="8" y="8" width="496" height="496" rx="124" fill="url(#bgGrad)" />

  <!-- Premium Typography Logo (Centered Monogram) -->
  <text id="monogram" x="256" y="340" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="240" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="-0.05em">FA</text>
</svg>
